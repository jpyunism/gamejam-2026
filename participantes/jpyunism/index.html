<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Neon Drift</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0a0a0f;
        width: 100%;
        height: 100%;
        /* Prevent rubber-band overscroll on iOS */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      #game {
        width: 100vw;
        height: 100vh;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #fs-prompt {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0f;
        color: #00ffff;
        font-family: monospace;
        font-size: 20px;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 9999;
        cursor: pointer;
      }
      #fs-prompt.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fs-prompt" class="visible" onclick="(function(){
      this.classList.remove('visible');
      var c = document.querySelector('#game canvas');
      if (c && c.requestFullscreen) c.requestFullscreen();
    }.call(this))">
      <div>
        <p>NEON DRIFT</p>
        <p style="font-size:14px;color:#888888">Tap to play</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
